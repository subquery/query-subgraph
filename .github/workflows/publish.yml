name: 'Publish'
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pre-ci:
    name: Pre-CI (Extract Commit Message)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      commit-message: ${{ steps.get_commit_message.outputs.commit-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: get_commit_message
        run: |
          if [ -n "${{ github.event.head_commit.message }}" ]
          then
            commit_msg="${{ github.event.head_commit.message }}"
            echo "commit-message=${commit_msg}" | head -n 1 >> "$GITHUB_OUTPUT"
          else
            commit_message=$(git log -1 --pretty=%B | head -n 1)
            echo "commit-message=$commit_message" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug commit message
        run: |
          echo "Commit message: ${{ steps.get_commit_message.outputs.commit-message }}"

  release:
    name: Release Publish
    needs: [pre-ci]
    if: >
      !startsWith(github.event.head_commit.message, '[SKIP CI]')
      && startsWith(github.event.head_commit.message, '[release]')
      && github.repository == 'subquery/query-subgraph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Update npm
        run: npm install -g npm@latest

      - run: yarn

      - name: build
        run: yarn build

      - name: Publish subgraph-query
        uses: ./.github/actions/create-release
        with:
          package-path: .
          repo-token: ${{ secrets.REPO_TOKEN }}

  prerelease:
    name: Prerelease Publish
    needs: [pre-ci]
    if: >
      !startsWith(needs.pre-ci.outputs.commit-message, '[SKIP CI]')
      && !startsWith(needs.pre-ci.outputs.commit-message, '[release]')
      && github.repository == 'subquery/query-subgraph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }} # Needed to push changes back to repo

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Update npm
        run: npm install -g npm@latest

      - run: yarn

      - name: build
        run: yarn build

      #Add remove-stable-version
      - name: Bump query-subgraph & deploy
        uses: ./.github/actions/create-prerelease
        with:
          package-path: .

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: '[SKIP CI] Prerelease'
          default_author: github_actions
